name: ren-app
options:
  bundleIdPrefix: com.individual.ren
  deploymentTarget:
    iOS: "17.0"

# 02 §2: the domain and use cases live in a local package so the compiler enforces the
# dependency direction — RenDomain imports Foundation only, RenApplication imports
# RenDomain only. A violating import fails the build rather than passing review.
packages:
  RenCore:
    path: RenCore

targets:
  Ren:
    type: application
    platform: iOS
    sources:
      - path: Ren
    dependencies:
      - package: RenCore
        product: RenDomain
    settings:
      INFOPLIST_FILE: Ren/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.individual.ren
      DEVELOPMENT_TEAM: FAD889UN6M
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "5.9"
      # 02 §8: iPhone only. 1 = iPhone.
      TARGETED_DEVICE_FAMILY: "1"

  RenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenTests
    dependencies:
      - target: Ren
      - package: RenCore
        product: RenDomain
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: FAD889UN6M
      SWIFT_VERSION: "5.9"

schemes:
  Ren:
    build:
      targets:
        Ren: all
        RenTests: [test]
    test:
      targets:
        - RenTests
